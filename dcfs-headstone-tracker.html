<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DC&S Order Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f4f7;
  --surface:#ffffff;
  --surface2:#e8f4f8;
  --border:#cde0e8;
  --border-l:#b2d4e0;
  --gold:#0097a7;
  --gold-l:#00bcd4;
  --gold-dim:#006064;
  --text:#1a2733;
  --text-dim:#546e7a;
  --muted:#90a4ae;
  --danger:#e05252;
  --green:#26a69a;
  --blue:#0288d1;
  --purple:#7c3aed;
  --orange:#f0914a;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;font-size:14px;min-height:600px;overflow-y:visible}

input,select,textarea{
  width:100%;padding:9px 12px;
  background:#ffffff;
  border:1px solid var(--border);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:13px;border-radius:6px;
  box-sizing:border-box;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--gold-dim);
  box-shadow:0 0 0 3px rgba(201,168,76,.08);
}
select option{background:#ffffff;color:var(--text)}
textarea{resize:vertical}
button{cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}

/* ── HEADER ── */
.hdr{
  background:linear-gradient(135deg,#5a8a2e 0%,#669d35 100%);
  padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid var(--border);
  height:56px;
}
.hdr-brand{font-family:'Cinzel',serif;font-size:15px;color:#ffffff;letter-spacing:.12em;font-weight:600}
.hdr-sub{font-family:'DM Sans',sans-serif;font-size:10px;color:rgba(255,255,255,0.75);margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:14px}
#price-status{font-size:10px;color:rgba(255,255,255,0.75);font-style:italic}
#sync-status{font-size:11px;color:var(--muted)}
.tab-btns{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:8px;border:1px solid var(--border)}
.tab-btn{
  padding:5px 16px;background:transparent;color:var(--muted);border:none;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;border-radius:6px;
  transition:all .2s;
}
.tab-btn.active{background:var(--gold-dim);color:#fff;box-shadow:0 2px 8px rgba(138,111,58,.4)}
.tab-btn:hover:not(.active){color:var(--text);background:var(--border)}

/* ── STATS ── */
.stats-row{display:flex;gap:12px;padding:20px 24px 0;flex-wrap:wrap}
.stat{
  background:#ffffff;
  border:1px solid var(--border);
  padding:16px 20px;border-radius:10px;
  min-width:130px;flex:1;
  position:relative;overflow:hidden;
  transition:border-color .2s,transform .15s;
}
.stat:hover{border-color:var(--border-l);transform:translateY(-1px)}
.stat::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent-from),var(--accent-to));
}
.stat-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:'Cinzel',serif}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1;font-weight:500}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:10px;padding:16px 24px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)}
.toolbar input{max-width:280px;background:var(--surface2)}
.toolbar select{width:auto;min-width:150px;background:var(--surface2)}
.btn-new{
  padding:9px 20px;
  background:linear-gradient(135deg,var(--gold-dim),#6b5020);
  color:#fff;border:none;border-radius:7px;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;
  box-shadow:0 2px 12px rgba(138,111,58,.3);
}
.btn-new:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(138,111,58,.4)}
.btn-sync{
  padding:9px 16px;
  background:var(--surface2);color:var(--text-dim);
  border:1px solid var(--border);border-radius:7px;
  font-size:12px;
}
.btn-sync:hover{border-color:var(--border-l);color:var(--text)}

/* ── ORDER CARDS ── */
#orders-list{padding:0 24px 30px}
.ocard{
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;margin:8px 0;
  cursor:pointer;position:relative;
  transition:all .2s;
  display:grid;grid-template-columns:1fr auto;gap:8px;
}
.ocard::before{
  content:'';position:absolute;left:0;top:12px;bottom:12px;
  width:3px;border-radius:0 2px 2px 0;
  background:var(--status-col,var(--gold-dim));
}
.ocard:hover{
  border-color:var(--border-l);
  transform:translateY(-1px);
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.ocard-left{padding-left:12px}
.ocard-name{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--text);margin-bottom:3px}
.ocard-sub{font-size:11px;color:var(--muted);margin-bottom:8px}
.ocard-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{
  padding:2px 8px;border-radius:20px;
  font-size:9px;letter-spacing:.05em;
  font-family:'Cinzel',serif;font-weight:500;
}
.ocard-right{text-align:right;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.ocard-price{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);line-height:1}
.ocard-bal{font-size:10px;color:var(--orange);margin-top:3px}
.ocard-del{
  background:none;border:none;color:var(--muted);
  font-size:13px;padding:2px 6px;border-radius:4px;
  opacity:0;transition:opacity .15s;
  position:absolute;top:10px;right:10px;
}
.ocard:hover .ocard-del{opacity:1}
.ocard-del:hover{color:var(--danger);background:rgba(224,82,82,.1)}
.empty-msg{padding:60px 20px;text-align:center;color:var(--muted)}
.empty-msg h3{font-family:'Cinzel',serif;font-size:14px;margin-bottom:8px;color:var(--text-dim)}

/* ── FORM ── */
#form-area{padding:0 24px 60px}
.fsec{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;
  color:var(--gold-dim);text-transform:uppercase;
  padding:18px 0 4px;border-bottom:1px solid var(--border);
  grid-column:span 2;margin-top:4px;
}
.flbl{font-size:10px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}

/* Form tiles */
.tile{
  background:var(--surface2);border:1px solid var(--border);
  padding:9px 13px;border-radius:7px;cursor:pointer;font-size:12px;
  transition:all .15s;display:flex;justify-content:space-between;
  align-items:center;gap:8px;min-width:110px;user-select:none;
}
.tile:hover{border-color:var(--border-l)}
.tile.on{background:rgba(201,168,76,.08);border-color:var(--gold-dim);}
.tile-n{font-weight:400;color:var(--text)}
.tile-p{font-size:10px;color:var(--muted)}
.tile.on .tile-p{color:var(--gold)}

/* Status buttons */
.sbtn{
  padding:6px 12px;border:none;border-radius:6px;
  font-size:10px;font-family:'Cinzel',serif;letter-spacing:.06em;
  cursor:pointer;transition:all .15s;
}

/* Note entries */
.note-entry{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;margin-bottom:8px;position:relative;
}
.note-ts{font-size:10px;color:var(--muted);margin-bottom:3px}
.note-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer}
.note-del:hover{color:var(--danger)}

/* Price tables */
#tab-prices{padding:24px}
.price-section{margin-bottom:24px}
.price-sec-title{
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;
  color:var(--gold);border-bottom:1px solid var(--border);
  padding-bottom:8px;margin-bottom:10px;
}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  background:var(--surface2);padding:8px 10px;text-align:left;
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:.08em;
  color:var(--muted);border-bottom:1px solid var(--border);
}
td{padding:7px 10px;border-bottom:1px solid var(--border)}
td.num{text-align:right;font-family:'Cormorant Garamond',serif;font-size:14px}
tr:nth-child(even) td{background:var(--surface2)}
tr:hover td{background:rgba(201,168,76,.04)}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-brand">David Crymble & Sons</div>
    <div class="hdr-sub">Headstone & Memorial Order Management</div>
  </div>
  <div class="hdr-right">
    <span id="price-status">⟳ Loading prices…</span>
    <span id="sync-status"></span>
    <div class="tab-btns">
      <button class="tab-btn active" onclick="showTab('orders')">Orders</button>
      <button class="tab-btn" onclick="showTab('prices')">Price List</button>
    </div>
  </div>
</div>

<div id="tab-orders">
  <div id="stats-row" class="stats-row"></div>
  <div class="toolbar" id="toolbar">
    <input type="text" id="srch" placeholder="Search name or order ID…" oninput="renderList()">
    <select id="fstatus" onchange="renderList()">
      <option value="">All Statuses</option>
      <option value="enquiry">Enquiry</option>
      <option value="quoted">Quoted</option>
      <option value="confirmed">Confirmed</option>
      <option value="design">In Design</option>
      <option value="production">Production</option>
      <option value="ready">Ready</option>
      <option value="installed">Installed</option>
    </select>
    <button class="btn-new" onclick="openNewOrder()">+ New Order</button>
    <button class="btn-sync" onclick="syncFromSheet()">⟳ Sync</button>
  </div>
  <div id="orders-list" style="min-height:300px;padding:0 20px 40px"></div>
  <div id="form-area"></div>
</div>

<div id="tab-prices" style="display:none">
  <div id="price-detail-status" style="padding:10px 20px;font-size:11px;color:var(--muted)"></div>
  <div id="price-tables" style="padding:0 20px"></div>
</div>

<script>
// ── CONFIG ──
const SHEET_ID = "1zLOSUsLgwglGkQkKa9x11EEIB04s2EOy1cBLBllkbRE";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmvDzdb0n2T2dFU6ykxymxidej8Od7hCIs32T7Q3dnCvgwkjGxKQOG4kRE3wnLWJZs/exec";
const BASE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;
const TABS = {
  headstones:  BASE + "%F0%9F%AA%A8%20Headstones",
  surrounds:   BASE + "%F0%9F%94%B2%20Surrounds",
  stones:      BASE + "%F0%9F%94%B2%20Stones",
  accessories: BASE + "%F0%9F%8E%81%20Accessories",
  cemeteries:  BASE + "%E2%9B%AA%20Cemetery%20Fees",
  newIns:      BASE + "%E2%9C%8D%EF%B8%8F%20New%20Inscriptions",
  addIns:      BASE + "%E2%9E%95%20Additional%20Inscriptions",
};
const STORE_KEY = "dcfs-v7";
const STATUSES = [
  {id:"enquiry",label:"Enquiry",color:"#94a3b8"},
  {id:"quoted",label:"Quoted",color:"#f59e0b"},
  {id:"confirmed",label:"Confirmed",color:"#3b82f6"},
  {id:"design",label:"In Design",color:"#8b5cf6"},
  {id:"production",label:"Production",color:"#f97316"},
  {id:"ready",label:"Ready",color:"#10b981"},
  {id:"installed",label:"Installed",color:"#059669"},
];
const PAY = ["Unpaid","Deposit Paid","Part Paid","Paid in Full"];
const PAYCOL = {"Paid in Full":"#10b981","Unpaid":"#ef4444","Deposit Paid":"#f59e0b","Part Paid":"#f97316"};
const HS_COLOURS = [
  {label:"Black",adj:0,note:"Stock price"},
  {label:"SA Impala",adj:50,note:"+£50"},
  {label:"Bahamas",adj:0,note:"Stock price"},
  {label:"Grey",adj:-50,note:"-£50"},
];
const INS_COLOURS = ["Silver","Gold","White"];

// ── STATE ──
let orders = [];
let prices = {
  headstones:[],surrounds:[],stones:[],accessories:[],cemeteries:[],
  inscription:[],
  newIns:{freeLetters:100,extraRate:4,styles:[]},
  addIns:{rate:5,minimum:200,styles:[]},
};
let editingId = null;

// ── HELPERS ──
const fmt = n => "£"+Number(n||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const v = id => document.getElementById(id);
const gv = id => (v(id)||{}).value||"";
const getLF = () => prices.newIns?.freeLetters||100;
const getNR = () => prices.newIns?.extraRate||4;
const getAR = () => prices.addIns?.rate||5;
const getAM = () => prices.addIns?.minimum||200;
const countLetters = t => (t||"").replace(/[^a-zA-Z0-9]/g,"").length;

function setSyncStatus(msg,col){
  const el=v("sync-status");
  if(el){el.textContent=msg;if(col)el.style.color=col;}
}

// ── INSCRIPTION CHARGE ──
function calcLetterCharge(text,type){
  const letters=countLetters(text);
  if(type==="additional") return Math.max(getAM(),letters*getAR());
  const extra=Math.max(0,letters-getLF());
  return extra*getNR();
}

// ── TOTAL ──
function calcTotal(o){
  if(!o)return 0;
  const hs=(prices.headstones.find(h=>h.type===o.hsType&&h.size===o.hsSize)||{sell:0}).sell;
  const colAdj=o.hsColourAdj||0;
  const surr=o.surroundType?(prices.surrounds.find(s=>s.type===o.surroundType)||{sell:0}).sell:0;
  const gran=(o.surroundGranite&&o.surroundType)?(prices.surrounds.find(s=>s.type===o.surroundType)||{graniteExtra:0}).graniteExtra:0;
  const stone=o.stoneType?(o.surroundType
    ?(prices.stones.find(s=>s.type===o.stoneType)||{withSurround:0}).withSurround
    :(prices.stones.find(s=>s.type===o.stoneType)||{standard:0}).standard):0;
  const accs=(o.accessories||[]).reduce((s,n)=>s+((prices.accessories.find(a=>a.name===n)||{sell:0}).sell),0);
  const cem=o.cemetery?(prices.cemeteries.find(c=>c.name===o.cemetery)||{fee:0}).fee:0;
  const ins=(o.inscriptionLines||0)*(o.inscriptionPpl||35);
  const letCharge=calcLetterCharge(o.inscriptionText||"",o.inscriptionType||"new");
  const extras=(o.extraCharges||[]).reduce((s,c)=>s+(parseFloat(c.amount)||0),0);
  return hs+colAdj+surr+gran+stone+accs+cem+ins+letCharge+extras;
}

// ── PERSISTENCE ──
function localSave(){try{localStorage.setItem(STORE_KEY,JSON.stringify(orders));}catch{}}
function localLoad(){try{const s=localStorage.getItem(STORE_KEY);return s?JSON.parse(s):[];}catch{return[];}}

async function syncFromSheet(){
  setSyncStatus("⟳ Loading…","#f59e0b");
  // Try direct fetch first
  try{
    const res=await fetch(SCRIPT_URL+"?t="+Date.now(),{
      method:"GET",
      redirect:"follow",
    });
    const text=await res.text();
    // Handle JSONP response if wrapped
    const jsonText=text.startsWith("{") ? text : text.replace(/^[^(]+\((.+)\)[\s;]*$/s,"$1");
    const json=JSON.parse(jsonText);
    if(json.success&&Array.isArray(json.orders)&&json.orders.length>0){
      const real=json.orders.filter(r=>r["Order ID"]&&r["Order ID"]!=="SETUP_ROW"&&!String(r["Order ID"]).startsWith("SETUP"));
      if(real.length>0){
        const localSnapshot=localLoad(); // Snapshot local data BEFORE overwriting
        orders=real.map(r=>rowToOrder(r,localSnapshot));
        localSave();
        setSyncStatus("✓ "+orders.length+" order"+(orders.length!==1?"s":"")+" loaded","#10b981");
        setTimeout(()=>setSyncStatus(""),4000);
        renderStats();renderList();
        return;
      }
    }
    setSyncStatus("0 orders in sheet","#94a3b8");
    renderList();
  }catch(e){
    console.warn("Direct fetch failed, trying JSONP:",e);
    // Try JSONP as fallback
    try{
      await syncViaJSONP();
    }catch(e2){
      console.error("Both sync methods failed:",e2);
      orders=localLoad();
      setSyncStatus("⚠ Could not connect to Sheet","#ef4444");
      renderList();
    }
  }
}

function syncViaJSONP(){
  return new Promise((resolve,reject)=>{
    const cb="dcfs_"+Date.now();
    const s=document.createElement("script");
    const timer=setTimeout(()=>{
      delete window[cb];s.remove();
      reject(new Error("JSONP timeout"));
    },8000);
    window[cb]=function(json){
      clearTimeout(timer);delete window[cb];s.remove();
      if(json.success&&Array.isArray(json.orders)&&json.orders.length>0){
        const real=json.orders.filter(r=>r["Order ID"]&&r["Order ID"]!=="SETUP_ROW");
        if(real.length>0){
          const localSnapshot=localLoad();
          orders=real.map(r=>rowToOrder(r,localSnapshot));
          localSave();
          setSyncStatus("✓ "+orders.length+" order"+(orders.length!==1?"s":"")+" loaded","#10b981");
          setTimeout(()=>setSyncStatus(""),4000);
          renderStats();renderList();
          resolve(true);return;
        }
      }
      setSyncStatus("","");renderList();resolve(false);
    };
    s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(new Error("JSONP script error"));};
    s.src=SCRIPT_URL+"?callback="+cb+"&t="+Date.now();
    document.head.appendChild(s);
  });
}

function rowToOrder(r, localSnapshot){
  localSnapshot=localSnapshot||localLoad(); // fallback if called without snapshot
  const o={
    id:r["Order ID"]||uid(),
    createdAt:(()=>{
      const v=r["Created"]||"";
      if(!v||v==="Invalid Date")return new Date().toISOString();
      // Already ISO format
      if(/^\d{4}-\d{2}-\d{2}/.test(v))return v;
      // Convert dd/mm/yyyy or dd/mm/yyyy hh:mm to ISO
      const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m)return new Date(`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`).toISOString();
      return new Date().toISOString();
    })(),
    status:(r["Status"]||"enquiry").toLowerCase().trim(),
    paymentStatus:r["Payment Status"]||"Unpaid",
    customerName:r["Customer Name"]||"",
    phone:r["Phone"]||"",email:r["Email"]||"",address:r["Address"]||"",
    deceasedName:r["Deceased Name"]||"",
    deceasedDob:toInputDate(r["Date of Birth"]),
    deceasedDod:toInputDate(r["Date of Passing"]),
    orderDate:toInputDate(r["Order Date"])||new Date().toISOString().slice(0,10),
    hsType:r["Headstone Type"]||"",hsSize:r["Headstone Size"]||"",
    hsColour:r["Headstone Colour"]||"",hsFinish:r["Headstone Finish"]||"",hsColourAdj:0,
    surroundType:r["Surround Type"]||"",surroundGranite:r["Granite Upgrade"]==="Yes",
    stoneType:r["Stone / Chippings"]||"",
    accessories:r["Accessories"]?r["Accessories"].split(", ").filter(Boolean):[],
    inscriptionType:r["Inscription Type"]==="Additional on Existing"?"additional":"new",
    inscriptionText:r["Inscription Text"]||"",
    inscriptionLines:parseInt(r["Inscription Lines"])||0,
    inscriptionStyle:r["Letter Style"]||"Standard",
    inscriptionColour:r["Inscription Colour"]||"Silver",
    inscriptionPpl:parseFloat(r["Price Per Line"])||35,
    cemetery:r["Cemetery / Location"]||"",graveNumber:r["Grave Number / Plot"]||"",
    ownerName:r["Grave Owner Name"]||"",ownerPhone:r["Owner Phone"]||"",
    ownerAddress:r["Owner Address"]||"",ownerEmail:r["Owner Email"]||"",
    ownerRelationship:r["Owner Relationship"]||"",
    depositPaid:r["Deposit Paid"]||"",
    proofDate:toInputDate(r["Proof Date"]),
    artworkApproved:r["Proof Approved"]==="Yes",
    productionDate:toInputDate(r["Production Start"]),
    installDate:toInputDate(r["Install Date"]),
    artworkNotes:r["Artwork Notes"]||"",notes:r["General Notes"]||"",masonNotes:r["Mason Notes"]||"",
    folderLink:r["Folder Link"]||"",
    totalPrice:parseFloat(r["Total Price"])||0,
    extraCharges:r["Extra Charges"]?JSON.parse(r["Extra Charges"]):[],
    masonCharges:r["Mason Charges"]?JSON.parse(r["Mason Charges"]):[],
    log:[],files:[],
  };
  // Merge from localStorage — Sheet may have stale/empty arrays
  const localMatch=localSnapshot.find(l=>l.id===o.id);
  if(localMatch){
    // Use localStorage extraCharges if Sheet has none
    if((!o.extraCharges||o.extraCharges.length===0)&&localMatch.extraCharges&&localMatch.extraCharges.length>0){
      o.extraCharges=localMatch.extraCharges;
    }
    // Use localStorage masonCharges if Sheet has none
    if((!o.masonCharges||o.masonCharges.length===0)&&localMatch.masonCharges&&localMatch.masonCharges.length>0){
      o.masonCharges=localMatch.masonCharges;
    }
    // Always restore log from localStorage — Sheet stores plain text, not structured
    if(localMatch.log&&localMatch.log.length>0){
      o.log=localMatch.log;
    }
    // Restore files from localStorage (base64 for PDF embedding)
    const sheetFiles=r["Files"]?JSON.parse(r["Files"]):[];
    if(localMatch.files&&localMatch.files.length>0){
      o.files=localMatch.files.map(lf=>{
        const sf=sheetFiles.find(s=>s.type===lf.type);
        return sf?Object.assign({},lf,{driveUrl:sf.driveUrl||lf.driveUrl,fileId:sf.fileId||lf.fileId,onDrive:sf.onDrive||lf.onDrive}):lf;
      });
      sheetFiles.forEach(sf=>{
        if(!o.files.find(f=>f.type===sf.type)&&sf.driveUrl)o.files.push(sf);
      });
    } else if(r["Files"]){
      try{o.files=JSON.parse(r["Files"]);}catch{}
    }
  }
  // Always recalculate total from live prices
  if(prices.headstones.length>0){
    o.totalPrice=calcTotal(o);
  }
  return o;
}

// Convert dd/mm/yyyy or dd/mm/yyyy hh:mm to yyyy-MM-dd for date inputs
function toInputDate(s){
  if(!s||s==="Invalid Date")return"";
  // Already in yyyy-MM-dd format
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  // Convert dd/mm/yyyy
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return"";
}
function parseCSV(text){
  const rows=[];let cur="",inQ=false,row=[];
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(inQ&&text[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){row.push(cur.trim());cur="";}
    else if((c==='\n'||c==='\r')&&!inQ){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cur.trim());rows.push(row);row=[];cur="";
    }else cur+=c;
  }
  if(cur||row.length){row.push(cur.trim());rows.push(row);}
  return rows.filter(r=>r.some(c=>c!==""));
}
const toNum=s=>parseFloat((s||"").replace(/[£,\s%]/g,""))||0;
const SKIP_VALS=["David Crymble","How to use","Tab","Type","Size","Sell Price","Cost Price",
  "Standard Price","With Surround","Surround Type","Stone / Chipping","Item Name",
  "Cemetery / Location","Letter Style","Rule","Field","Headstone Type","Style Pricing",
  "Instructions","Headstones","Surrounds","Stones","Accessories","Cemetery","Inscription",
  "Summary","💡","←","Margin","Fee (£)","Notes","Size / Description"];
const isSkip=val=>!val||SKIP_VALS.some(p=>(val||"").includes(p));

async function fetchPrices(){
  v("price-status").textContent="⟳ Loading prices…";
  try{
    const safe=async url=>{try{const r=await fetch(url);return parseCSV(await r.text());}catch{return[];}};
    const [hsR,surR,stR,accR,cemR,niR,aiR]=await Promise.all([
      safe(TABS.headstones),safe(TABS.surrounds),safe(TABS.stones),
      safe(TABS.accessories),safe(TABS.cemeteries),safe(TABS.newIns),safe(TABS.addIns)
    ]);
    prices.headstones=[];for(const r of hsR){const t=(r[1]||"").trim(),s=(r[2]||"").trim(),sell=toNum(r[3]),cost=toNum(r[4]);if(t&&s&&sell&&!isSkip(t))prices.headstones.push({type:t,size:s,sell,cost});}
    prices.surrounds=[];for(const r of surR){const t=(r[1]||"").trim(),sell=toNum(r[2]),gran=toNum(r[3]),cost=toNum(r[4]);if(t&&sell&&!isSkip(t))prices.surrounds.push({type:t,sell,graniteExtra:gran,cost});}
    prices.stones=[];for(const r of stR){const t=(r[1]||"").trim();if(t&&!isSkip(t))prices.stones.push({type:t,standard:toNum(r[2]),withSurround:toNum(r[3])});}
    prices.accessories=[];for(const r of accR){const n=(r[1]||"").trim(),s=(r[2]||"").trim(),sell=toNum(r[3]),cost=toNum(r[4]);if(n&&sell&&!isSkip(n))prices.accessories.push({name:n,size:s,sell,cost});}
    prices.cemeteries=[];for(const r of cemR){const n=(r[1]||"").trim(),fee=toNum(r[2]),notes=(r[3]||"").trim();if(n&&!isSkip(n))prices.cemeteries.push({name:n,fee,notes});}
    let fl=100,er=4,ns=[];
    for(const r of niR){const l=(r[1]||"").trim(),v3=toNum(r[3]);if(l.includes("Free Letter")){fl=toNum(r[2])||100;}else if(l.includes("Extra letters")){er=toNum(r[2])||4;}else if(l&&v3>0&&!isSkip(l))ns.push({style:l,costPerLetter:toNum(r[2]),sellPerLetter:v3});}
    prices.newIns={freeLetters:fl,extraRate:er,styles:ns};
    prices.inscription=ns;
    let ar=5,am=200,as2=[];
    for(const r of aiR){const l=(r[1]||"").trim(),v3=toNum(r[3]);if(l.includes("Rate per Letter")){ar=toNum(r[2])||5;}else if(l.includes("Minimum Charge")){am=toNum(r[2])||200;}else if(l&&v3>0&&!isSkip(l))as2.push({style:l,costPerLetter:toNum(r[2]),sellPerLetter:v3});}
    prices.addIns={rate:ar,minimum:am,styles:as2};
    const n=prices.headstones.length+prices.surrounds.length+prices.stones.length+prices.accessories.length+prices.cemeteries.length;
    const t=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    v("price-status").textContent=`✓ Live prices · ${t}`;
    v("price-status").style.color="#10b981";
    v("price-detail-status").textContent=`✓ ${n} items loaded · Free: ${fl} letters · Extra: £${er}/letter · Add-on: £${ar}/letter (min £${am})`;
    renderPrices();
    // Recalculate all order totals from live prices
    orders.forEach(o=>{o.totalPrice=calcTotal(o);});
    localSave();
    renderStats();renderList();
    if(editingId){
      saveFormToOrder(); // Save current field values before re-rendering
      renderForm();      // Re-render to populate dropdowns with loaded prices
    }
  }catch(e){
    console.error("Price fetch error:",e);
    v("price-status").textContent="⚠ Price sheet unreachable";
    v("price-status").style.color="var(--danger)";
  }
}

let autoSaveTimer=null;
let isPageLoading=true;setTimeout(()=>{isPageLoading=false;},5000);
function triggerAutoSave(){
  if(isPageLoading)return;
  clearTimeout(autoSaveTimer);
  const ind=document.getElementById("autosave-indicator");
  if(ind)ind.textContent="✎ Unsaved…";
  autoSaveTimer=setTimeout(async()=>{
    const o=getOrder();if(!o)return;
    const get=id=>document.getElementById(id)?.value||"";

function renderLetterCounter(text,type){
  const letters=countLetters(text);
  const charge=calcLetterCharge(text,type);
  if(type==="additional"){
    const raw=letters*getAR();
    const isMin=raw<getAM();
    const col=letters===0?"var(--muted)":"#0097a7";
    return `<div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:11px;color:var(--muted)">
        <strong style="color:var(--text)">${letters}</strong> letter${letters!==1?"s":""}
        ${letters>0?`× £${getAR()} per letter`:""}
        ${isMin&&letters>0?`<span style="color:#f59e0b;margin-left:6px">— minimum £${getAM()} applies</span>`:""}
      </div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:${col}">${fmt(charge)}</div>
    </div>`;
  }
  // New inscription
  const extra=Math.max(0,letters-getLF());
  const freeLeft=Math.max(0,getLF()-letters);
  const col=letters===0?"var(--muted)":extra>0?"#0097a7":"#10b981";
  return `<div style="display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:11px;color:var(--muted)">
      <strong style="color:var(--text)">${letters}</strong> letter${letters!==1?"s":""}
      ${letters===0
        ? `— first ${getLF()} letters free`
        : extra===0
          ? `<span style="color:#10b981;margin-left:6px">✓ ${freeLeft} free letter${freeLeft!==1?"s":""} remaining</span>`
          : `<span style="color:#ef4444;margin-left:6px">— ${extra} extra @ £${getNR()} each</span>`
      }
    </div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:${col}">${charge>0?fmt(charge):"Included"}</div>
  </div>`;
}

// ── FILE HANDLING — Google Drive via iframe POST ──
function uploadFile(input, type){
  const file=input.files[0];if(!file)return;
  const o=getOrder();if(!o)return;
  setSyncStatus("⟳ Reading file…","#f59e0b");

  const reader=new FileReader();
  reader.onload=async e=>{
    const base64=e.target.result.split(",")[1];
    const dataUrl=e.target.result;

    // Always store locally first — keep base64 for PDF embedding
    o.files=o.files||[];
    o.files=o.files.filter(f=>f.type!==type);
    o.files.push({
      type,
      name:file.name,
      url:dataUrl,        // Keep base64 locally for PDF image embedding
      localBase64:dataUrl, // Explicit backup for job card
      uploadedAt:new Date().toISOString(),
      onDrive:false,
      pending:true
    });
    updateOrder(o);localSave();
    renderForm();
    setSyncStatus("⟳ Uploading to Drive…","#f59e0b");

    // Try to upload to Drive
    try{
      const payload=JSON.stringify({
        action:"uploadFile",
        orderId:o.id,
        customerName:o.customerName||"Unknown",
        deceasedName:o.deceasedName||"Memorial",
        fileName:file.name,
        fileType:type,
        fileData:base64,
        mimeType:file.type||"application/octet-stream",
      });

      let uploaded=false;
      try{
        const res=await fetch(SCRIPT_URL,{method:"POST",body:payload,headers:{"Content-Type":"text/plain"}});
        const text=await res.text();
        const json=JSON.parse(text);
        if(json.success){
          const entry=o.files.find(f=>f.type===type);
          if(entry){
            entry.driveUrl=json.viewUrl;  // Store Drive URL separately
            entry.fileId=json.fileId;
            entry.onDrive=true;
            delete entry.pending;
            // Keep entry.url and entry.localBase64 as base64 for PDF embedding
          }
          if(!o.folderLink&&json.folderUrl)o.folderLink=json.folderUrl;
          updateOrder(o);localSave();
          saveOrderToSheet(o);
          setSyncStatus("✓ Uploaded to Google Drive","#10b981");
          setTimeout(()=>setSyncStatus(""),3000);
          renderForm();
          uploaded=true;
        }
      }catch(fetchErr){
        console.warn("Direct fetch blocked by CORS:",fetchErr.message);
      }

      if(!uploaded){
        fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:payload});
        const entry=o.files.find(f=>f.type===type);
        if(entry){entry.onDrive=true;delete entry.pending;}
        updateOrder(o);localSave();
        setSyncStatus("✓ Sent to Drive (preview stored locally)","#f59e0b");
        setTimeout(()=>setSyncStatus(""),4000);
        saveOrderToSheet(o);
      }
    }catch(err){
      console.warn("Upload error:",err);
      setSyncStatus("⚠ Preview saved locally only","#f97316");
      setTimeout(()=>setSyncStatus(""),4000);
    }
  };
  reader.readAsDataURL(file);
}

async function removeFile(type){
  const o=getOrder();if(!o)return;
  const f=(o.files||[]).find(x=>x.type===type);
  if(f&&f.fileId){
    try{fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"deleteFile",fileId:f.fileId})});}
    catch(e){console.warn("Drive delete failed:",e);}
  }
  o.files=(o.files||[]).filter(x=>x.type!==type);
  updateOrder(o);localSave();
  saveOrderToSheet(o);
  renderForm();
}

function pdfItem(doc,label,amount,y){

      // Handle long lines — wrap them
      const wrapped=doc.splitTextToSize(trimmed,172);
      wrapped.forEach(line=>{doc.text(line,x,y);y+=5.5;});
      doc.setFont("helvetica","normal");
      return y+1;
    }
    // Section sub-header — bold label, no price
    doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(30,30,30);
    doc.text(trimmed,x,y);
    doc.setFont("helvetica","normal");
    return y+6;
  }
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(30,30,30);
  const isIndented=label.startsWith("  ");

  return y+6;
}

function getLineItems(o){
  const items=[];
  const hs=prices.headstones.find(h=>h.type===o.hsType&&h.size===o.hsSize);
  if(hs){let l=`${o.hsType} ${o.hsSize}`;if(o.hsColour)l+=` — ${o.hsColour}`;if(o.hsFinish)l+=`, ${o.hsFinish}`;items.push([l,hs.sell+(o.hsColourAdj||0)]);}
  if(o.surroundType){const s=prices.surrounds.find(x=>x.type===o.surroundType);if(s){items.push([`Surround — ${o.surroundType}`,s.sell]);if(o.surroundGranite)items.push([`6" Granite Upgrade`,s.graniteExtra]);}}
  if(o.stoneType){const st=prices.stones.find(x=>x.type===o.stoneType);if(st)items.push([`Stones / Chippings — ${o.stoneType}`,o.surroundType?st.withSurround:st.standard]);}
  (o.accessories||[]).forEach(n=>{const a=prices.accessories.find(x=>x.name===n);if(a)items.push([`${n}${a.size?" ("+a.size+")":""}`,a.sell]);});
  if(o.cemetery){const c=prices.cemeteries.find(x=>x.name===o.cemetery);if(c&&c.fee>0)items.push([`Cemetery / Planning Fee — ${o.cemetery}`,c.fee]);}

  // Inscription — always show if text exists or lines selected
  const insType=o.inscriptionType||"new";
  const lt=countLetters(o.inscriptionText||"");
  const lines=o.inscriptionLines||0;
  const ppl=o.inscriptionPpl||35;
  const style=o.inscriptionStyle||"Standard";
  const colour=o.inscriptionColour||"Silver";

  if(insType==="additional"){
    const ch=calcLetterCharge(o.inscriptionText||"","additional");
    if(o.inscriptionText||ch>0){
      items.push([`Additional Inscription on Existing Stone`,null]);
      if(o.inscriptionText){
        o.inscriptionText.trim().split("\n").forEach(line=>{if(line.trim())items.push([`  "${line.trim()}"`,null]);});
      }
      if(ch>0)items.push([`  Inscription charge`,ch]);
    }
  } else {
    const ex=Math.max(0,lt-getLF());
    const letterCharge=ex>0?ex*getNR():0;
    const lineCharge=lines*ppl;
    const total=lineCharge+letterCharge;
    if(o.inscriptionText||lines>0){
      items.push([`New Inscription`,null]);
      if(o.inscriptionText){
        o.inscriptionText.trim().split("\n").forEach(line=>{if(line.trim())items.push([`  "${line.trim()}"`,null]);});
      }
      if(total>0)items.push([`  Inscription charge`,total]);
      else if(lt>0)items.push([`  ${lt} letters — included free`,0]);
    }
  }

  // Extra charges — appear on Estimate and Invoice
  (o.extraCharges||[]).forEach(c=>{
    if(c.label&&c.amount) items.push([c.label, parseFloat(c.amount)||0]);
  });

  return items;
}

// ── SAVE PDF TO GOOGLE DRIVE ──
async function savePdfToDrive(base64, fileName, fileType){
  const o=getOrder();if(!o)return null;
  setSyncStatus("⟳ Saving PDF to Drive…","#f59e0b");
  try{
    const payload=JSON.stringify({
      action:"uploadFile",
      orderId:o.id,
      customerName:o.customerName||"Unknown",
      deceasedName:o.deceasedName||"Memorial",
      fileName:fileName,
      fileType:fileType,
      fileData:base64,
      mimeType:"application/pdf",
    });
    try{
      const res=await fetch(SCRIPT_URL,{method:"POST",body:payload,headers:{"Content-Type":"text/plain"}});
      const text=await res.text();
      const json=JSON.parse(text);
      if(json.success){
        if(!o.folderLink&&json.folderUrl){
          o.folderLink=json.folderUrl;
          updateOrder(o);localSave();
          const fl=document.getElementById("f-folder-link");
          if(fl)fl.value=json.folderUrl;
        }
        setSyncStatus("✓ PDF saved to Drive","#10b981");
        setTimeout(()=>setSyncStatus(""),3000);
        return json.viewUrl||json.folderUrl||null; // Return the file URL
      }
    }catch(e){
      console.warn("Direct fetch failed, trying no-cors:",e.message);
    }
    // Fallback no-cors — can't get URL back
    fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:payload});
    setSyncStatus("✓ PDF sent to Drive","#f59e0b");
    setTimeout(()=>setSyncStatus(""),3000);
    return o.folderLink||null; // Return folder link as best fallback
  }catch(err){
    console.warn("PDF Drive upload failed:",err);
    setSyncStatus("⚠ PDF not saved to Drive","#ef4444");
    setTimeout(()=>setSyncStatus(""),3000);
    return null;
  }
}

  doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text("If a bank or solicitor is acting on your behalf, then please advise us.",14,y);y+=12;
  if(y>240){doc.addPage();pdfFooter(doc);y=20;}
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(20,20,20);
  doc.text("Yours sincerely",14,y);y+=20;doc.text("David Crymble & Sons",14,y);
  const invFileName="Invoice-"+ref+"-"+(o.customerName||"Customer").replace(/\s+/g,"-")+".pdf";
  pdfFooter(doc);

}

async function genJobCard(){
  const o=getOrder();if(!o)return;
  const{jsPDF}=window.jspdf;const doc=new jsPDF();const ref="JOB-"+o.id.slice(-6).toUpperCase();
  pdfLogo(doc);pdfRef(doc,ref);let y=54;
  doc.setFillColor(240,240,240);doc.rect(14,y,182,8,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(20,20,20);
  doc.text("JOB CARD — STONE MASON INSTRUCTION",105,y+5.5,"center");y+=14;
  const fld=(l,val,y)=>{doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(l,14,y);doc.setFont("helvetica","normal");doc.text(String(val||"—"),60,y);return y+6;};
  y=pdfSecHdr(doc,"Customer Details",y);y=fld("Name:",o.customerName,y);y=fld("Phone:",o.phone,y);y=fld("Address:",o.address,y);y+=4;
  y=pdfSecHdr(doc,"Deceased / Memorial",y);y=fld("Name:",o.deceasedName,y);y=fld("Date of Birth:",fmtDate(o.deceasedDob),y);y=fld("Date of Passing:",fmtDate(o.deceasedDod),y);y=fld("Cemetery:",o.cemetery||"—",y);y=fld("Grave Number:",o.graveNumber||"—",y);y+=4;
  if(o.ownerName){y=pdfSecHdr(doc,"Grave Owner",y);y=fld("Owner Name:",o.ownerName,y);y=fld("Phone:",o.ownerPhone||"—",y);y=fld("Relationship:",o.ownerRelationship||"—",y);y+=4;}
  y=pdfSecHdr(doc,"Headstone Specification",y);
  y=fld("Type:",o.hsType||"—",y);y=fld("Size:",o.hsSize||"—",y);y=fld("Colour:",o.hsColour||"Black (stock)",y);y=fld("Finish:",o.hsFinish||"—",y);
  y=fld("Surround:",o.surroundType||"None",y);if(o.surroundType)y=fld('6" Granite:',o.surroundGranite?"Yes":"No",y);
  y=fld("Stones/Chippings:",o.stoneType||"None",y);if((o.accessories||[]).length>0)y=fld("Accessories:",(o.accessories||[]).join(", "),y);y+=4;
  if(y>210){doc.addPage();pdfFooter(doc);y=20;}
  y=pdfSecHdr(doc,"Inscription",y);
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  doc.text(`Style: ${o.inscriptionStyle||"Standard"}   Colour: ${o.inscriptionColour||"Silver"}   Lines: ${o.inscriptionLines||0}   Type: ${o.inscriptionType==="additional"?"Additional":"New"}`,14,y);y+=5;
  const insH=Math.max(26,doc.splitTextToSize(o.inscriptionText||"",170).length*7+10);
  doc.setFillColor(252,250,246);doc.rect(14,y,182,insH,"F");doc.setDrawColor(180,160,120);doc.setLineWidth(0.5);doc.rect(14,y,182,insH);
  doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(138,111,58);doc.text("INSCRIPTION TEXT:",16,y+6);
  doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(20,20,20);
  doc.text(doc.splitTextToSize(o.inscriptionText||"[No inscription provided]",170),16,y+13);y+=insH+6;
  if(o.artworkNotes){y=pdfSecHdr(doc,"Artwork / Design Notes",y);doc.setFont("helvetica","normal");doc.setFontSize(9.5);const al=doc.splitTextToSize(o.artworkNotes,182);doc.text(al,14,y);y+=al.length*5+6;}

  // ── ATTACH CUSTOMER PHOTO & SIGNED APPROVAL IF AVAILABLE ──
  const customerPhoto=(o.files||[]).find(f=>f.type==="Customer Photo");
  const signedApproval=(o.files||[]).find(f=>f.type==="Signed Approval");

  function getImgData(f){
    if(!f)return null;
    for(const src of [f.localBase64,f.url,f.dataUrl]){
      if(src&&/^data:image/i.test(String(src)))return src;
    }
    return null;
  }

  function addImgSection(file,title,maxH){
    if(!file)return;
    if(y>200){doc.addPage();pdfFooter(doc);y=20;}
    y=pdfSecHdr(doc,title,y);
    const imgData=getImgData(file);
    if(imgData){
      try{
        const props=doc.getImageProperties(imgData);
        const maxW=182;
        let iw=props.width,ih=props.height;
        const ratio=Math.min(maxW/iw,maxH/ih);
        iw*=ratio;ih*=ratio;
        doc.addImage(imgData,"",14+(maxW-iw)/2,y,iw,ih);
        y+=ih+6;
      }catch(e){
        doc.setFont("helvetica","italic");doc.setFontSize(9);doc.setTextColor(120,120,120);
        doc.text("Image could not be embedded — "+file.name,14,y);y+=7;
        doc.setFont("helvetica","normal");doc.setTextColor(20,20,20);
      }
    } else {
      doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(30,30,30);
      doc.text("File: "+(file.name||"Unknown"),14,y);y+=6;
    }
    // Always show Drive link if available
    const driveUrl=file.driveUrl||(file.url&&file.url.startsWith("http")?file.url:"");
    if(driveUrl){
      doc.setFont("helvetica","italic");doc.setFontSize(8.5);doc.setTextColor(29,78,216);
      const urlLines=doc.splitTextToSize("Drive: "+driveUrl,182);
      doc.text(urlLines,14,y);
      doc.setFont("helvetica","normal");doc.setTextColor(20,20,20);
      y+=urlLines.length*5+4;
    } else if(!imgData){
      doc.setFont("helvetica","italic");doc.setFontSize(8.5);doc.setTextColor(120,120,120);
      doc.text("File in Google Drive folder — see folder link on order",14,y);
      doc.setFont("helvetica","normal");doc.setTextColor(20,20,20);
      y+=7;
    }
    y+=4;
  }

  addImgSection(customerPhoto,"Customer Photo — For Engraving Reference",100);
  addImgSection(signedApproval,"Signed Proof Approval",110);
  y=fld("Proof Date:",o.proofDate?fmtDate(o.proofDate):"TBC",y);y=fld("Proof Approved:",o.artworkApproved?"Yes — approved":"No — awaiting",y);
  y=fld("Production Start:",o.productionDate?fmtDate(o.productionDate):"TBC",y);y=fld("Installation Date:",o.installDate?fmtDate(o.installDate):"TBC",y);
  if(o.notes){y+=4;y=pdfSecHdr(doc,"Special Instructions",y);const nl=doc.splitTextToSize(o.notes,182);doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text(nl,14,y);y+=nl.length*5+4;}
  if(o.masonNotes){
    if(y>230){doc.addPage();pdfFooter(doc);y=20;}
    y+=4;
    // Highlighted box for mason notes
    doc.setFillColor(30,28,20);doc.rect(14,y,182,8,"F");
    doc.setDrawColor(184,154,94);doc.setLineWidth(0.5);doc.rect(14,y,182,8);
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(138,111,58);
    doc.text("MASON NOTES:",16,y+5.5);
    doc.setFont("helvetica","normal");doc.setTextColor(20,20,20);
    y+=10;
    const ml=doc.splitTextToSize(o.masonNotes,178);
    doc.setFontSize(9.5);doc.text(ml,16,y);y+=ml.length*5+6;
  }


  // Cost price table — sectioned breakdown for mason
  if(y>200){doc.addPage();pdfFooter(doc);y=20;}
  y+=4;y=pdfSecHdr(doc,"Stone Mason Cost Schedule",y);

  // Helper: draw section header row
  function jcSecRow(title,yy){
    doc.setFillColor(60,72,88);doc.rect(14,yy,182,6,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(184,154,94);
    doc.text(title.toUpperCase(),16,yy+4);
    return yy+6;
  }
  // Helper: draw item row
  function jcRow(label,cost,yy,shade){
    if(shade){doc.setFillColor(248,246,242);doc.rect(14,yy,182,6.5,"F");}
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(30,30,30);
    doc.text(String(label).slice(0,72),16,yy+4.5);
    doc.setFont("helvetica","bold");
    doc.text(cost>0?"£"+Number(cost).toLocaleString("en-GB",{minimumFractionDigits:2}):"—",196,yy+4.5,"right");
    doc.setFont("helvetica","normal");
    return yy+6.5;
  }
  // Helper: draw subtotal row
  function jcSubtotal(label,cost,yy){
    doc.setFillColor(235,230,220);doc.rect(14,yy,182,6.5,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(80,60,20);
    doc.text(label,16,yy+4.5);
    doc.text("£"+Number(cost).toLocaleString("en-GB",{minimumFractionDigits:2}),196,yy+4.5,"right");
    doc.setFont("helvetica","normal");doc.setTextColor(30,30,30);
    return yy+8;
  }

  let jcGrandTotal=0;

  // ── HEADSTONE ──
  const jcHsItem=prices.headstones.find(h=>h.type===o.hsType&&h.size===o.hsSize);
  if(o.hsType||o.hsSize){
    if(y>230){doc.addPage();pdfFooter(doc);y=20;}
    y=jcSecRow("Headstone",y);
    let hsCost=0;
    if(jcHsItem&&jcHsItem.cost>0){
      y=jcRow(o.hsType+" "+o.hsSize+(o.hsColour?" ("+o.hsColour+")":"")+(o.hsFinish?", "+o.hsFinish:""),jcHsItem.cost,y,false);
      hsCost+=jcHsItem.cost;
    }else{
      y=jcRow((o.hsType||"")+" "+(o.hsSize||"")+" — cost not in price book",0,y,false);
    }
    if(hsCost>0){y=jcSubtotal("Headstone Subtotal",hsCost,y);jcGrandTotal+=hsCost;}
  }

  // ── SURROUND ──
  if(o.surroundType){
    const jcS=prices.surrounds.find(x=>x.type===o.surroundType);
    if(jcS){
      if(y>230){doc.addPage();pdfFooter(doc);y=20;}
      y=jcSecRow("Surround & Base",y);
      let sCost=0;
      y=jcRow("Surround — "+o.surroundType,jcS.cost,y,false);sCost+=jcS.cost;
      if(o.surroundGranite){const gCost=jcS.graniteExtra>0?Math.round(jcS.graniteExtra*0.75):0;y=jcRow('6" Granite Upgrade',gCost,y,true);sCost+=gCost;}
      if(sCost>0){y=jcSubtotal("Surround Subtotal",sCost,y);jcGrandTotal+=sCost;}
    }
  }

  // ── STONES ──
  if(o.stoneType){
    const jcSt=prices.stones.find(x=>x.type===o.stoneType);
    if(jcSt){
      if(y>230){doc.addPage();pdfFooter(doc);y=20;}
      y=jcSecRow("Stones / Chippings",y);
      const stP=o.surroundType?jcSt.withSurround:jcSt.standard;
      const stCost=Math.round(stP*0.6);
      y=jcRow("Stones / Chippings — "+o.stoneType,stCost,y,false);
      if(stCost>0){y=jcSubtotal("Stones Subtotal",stCost,y);jcGrandTotal+=stCost;}
    }
  }

  // ── ACCESSORIES ──
  const jcAccItems=(o.accessories||[]).map(n=>{const a=prices.accessories.find(x=>x.name===n);return a?{name:n+(a.size?" ("+a.size+")":""),cost:a.cost}:null;}).filter(Boolean);
  if(jcAccItems.length>0){
    if(y>230){doc.addPage();pdfFooter(doc);y=20;}
    y=jcSecRow("Accessories",y);
    let accTotal=0;
    jcAccItems.forEach(function(a,i){y=jcRow(a.name,a.cost,y,i%2!==0);accTotal+=a.cost;});
    if(accTotal>0){y=jcSubtotal("Accessories Subtotal",accTotal,y);jcGrandTotal+=accTotal;}
  }

  // ── INSCRIPTION ──
  const jcLetters=countLetters(o.inscriptionText||"");
  if(jcLetters>0||o.inscriptionLines>0){
    if(y>220){doc.addPage();pdfFooter(doc);y=20;}
    y=jcSecRow("Inscription",y);

    // Cost: first 100 letters free, then £2 per letter after 100
    const JC_INS_FREE=100;
    const JC_INS_RATE=2;
    const extraLetters=Math.max(0,jcLetters-JC_INS_FREE);
    const jcCost2=extraLetters*JC_INS_RATE;

    y=jcRow((o.inscriptionType==="additional"?"Additional Inscription":"New Inscription"),0,y,false);
    if(o.inscriptionStyle)y=jcRow("Style: "+o.inscriptionStyle+", Colour: "+(o.inscriptionColour||"Silver"),0,y,true);
    if(jcLetters>0)y=jcRow("Letter count: "+jcLetters+" letter"+(jcLetters!==1?"s":""),0,y,false);
    if(jcLetters<=JC_INS_FREE){
      y=jcRow("All "+jcLetters+" letters within free allowance ("+JC_INS_FREE+" free)",0,y,true);
    } else {
      y=jcRow("First "+JC_INS_FREE+" letters — included free",0,y,true);
      y=jcRow(extraLetters+" extra letter"+(extraLetters!==1?"s":"")+" @ £"+JC_INS_RATE+" each",extraLetters*JC_INS_RATE,y,false);
    }
    if(jcCost2>0){y=jcSubtotal("Inscription Subtotal",jcCost2,y);jcGrandTotal+=jcCost2;}
  }

  // ── CEMETERY ──
  if(o.cemetery){
    const jcCem=prices.cemeteries.find(x=>x.name===o.cemetery);
    if(jcCem&&jcCem.fee>0){
      if(y>230){doc.addPage();pdfFooter(doc);y=20;}
      y=jcSecRow("Cemetery / Planning",y);
      y=jcRow("Cemetery Fee — "+o.cemetery,jcCem.fee,y,false);
      y=jcSubtotal("Cemetery Subtotal",jcCem.fee,y);
      jcGrandTotal+=jcCem.fee;
    }
  }

  // ── MASON ADDITIONAL CHARGES ──
  const jcMason=(o.masonCharges||[]).filter(function(c){return c.label&&c.amount;});
  if(jcMason.length>0){
    if(y>230){doc.addPage();pdfFooter(doc);y=20;}
    // Red section header for mason charges
    doc.setFillColor(220,38,38);doc.rect(14,y,182,6,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(255,255,255);
    doc.text("⚠  ADDITIONAL MASON CHARGES",16,y+4);
    y+=6;doc.setTextColor(20,20,20);
    let masonTotal=0;
    jcMason.forEach(function(c,i){
      if(i%2===0){doc.setFillColor(255,245,245);doc.rect(14,y,182,6.5,"F");}
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(30,30,30);
      doc.text(String(c.label).slice(0,70),16,y+4.5);
      doc.setFont("helvetica","bold");doc.setTextColor(220,38,38);
      doc.text("£"+Number(parseFloat(c.amount)||0).toLocaleString("en-GB",{minimumFractionDigits:2}),196,y+4.5,"right");
      doc.setFont("helvetica","normal");doc.setTextColor(30,30,30);
      masonTotal+=parseFloat(c.amount)||0;
      y+=6.5;
    });
    // Red subtotal
    doc.setFillColor(220,38,38);doc.rect(14,y,182,6.5,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(255,255,255);
    doc.text("Mason Charges Subtotal",16,y+4.5);
    doc.text("£"+masonTotal.toLocaleString("en-GB",{minimumFractionDigits:2}),196,y+4.5,"right");
    doc.setFont("helvetica","normal");doc.setTextColor(30,30,30);
    y+=10;
    jcGrandTotal+=masonTotal;
  }

  // ── GRAND TOTAL ──
  if(y>255){doc.addPage();pdfFooter(doc);y=20;}
  y+=2;
  doc.setFillColor(30,37,48);doc.rect(14,y,182,9,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(184,154,94);
  doc.text("TOTAL DUE TO MASON",16,y+6);
  doc.text("£"+jcGrandTotal.toLocaleString("en-GB",{minimumFractionDigits:2}),196,y+6,"right");
  y+=18;


  if(y>245){doc.addPage();pdfFooter(doc);y=20;}
  doc.setDrawColor(180,180,180);doc.setLineWidth(0.4);doc.rect(14,y,85,26);doc.rect(111,y,85,26);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(100,100,100);
  doc.text("Stone Mason Signature",16,y+6);doc.text("Print Name: _____________________",16,y+14);doc.text("Date: ___________________________",16,y+21);
  doc.text("DC&S Authorised By",113,y+6);doc.text("Signature: ______________________",113,y+14);doc.text("Date: ___________________________",113,y+21);
  const jobFileName="JobCard-"+ref+"-"+(o.deceasedName||o.customerName||"Order").replace(/\s+/g,"-")+".pdf";
  pdfFooter(doc);
  const jobBase64=doc.output("datauristring").split(",")[1];
  doc.save(jobFileName);
  await savePdfToDrive(jobBase64, jobFileName, "Job Card");
}
